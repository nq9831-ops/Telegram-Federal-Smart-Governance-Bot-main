# Test-only configuration
#
# Credentials and tokens are intentionally supplied by the test environment.
# Do not add literal passwords, API tokens, private keys, or real identifiers.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
spring:
  datasource:
    url: ${TGG_TEST_DB_URL:jdbc:mysql://localhost:3306/tgg_test?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${TGG_TEST_DB_USER:}
    password: ${TGG_TEST_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
tgg:
  retention:
    cron: "0 0 0 1 1 *"
  notify:
    flush-interval-ms: 86400000
  webhook:
    path: /webhook
    secret: ${TGG_TEST_WEBHOOK_SECRET:}
    bot-token: ${TGG_TEST_BOT_TOKEN:}
  command-menu:
    enabled: false
  permission:
    admins: ${TGG_TEST_PERMISSION_ADMINS:}
