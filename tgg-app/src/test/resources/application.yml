spring:
  datasource:
    # 测试直连本机 MySQL —— 刻意不用 H2：H2 的 MySQL 兼容模式不等于 MySQL，
    # 用它会掩盖方言差异（utf8mb4、时间戳默认值、负数 bigint 主键等）。
    # 隔离手段：测试类加 @Transactional，每个用例结束自动回滚。
    url: jdbc:mysql://localhost:3306/tgg?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai
    username: tgg
    password: tggdev
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

tgg:
  webhook:
    path: /webhook
    secret: test-secret-value
    bot-token: test-bot-token
