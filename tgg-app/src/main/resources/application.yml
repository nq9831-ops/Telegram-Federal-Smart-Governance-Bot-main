spring:
  application:
    name: tgg

  datasource:
    # 生产环境必须用环境变量覆盖，尤其密码
    url: ${TGG_DB_URL:jdbc:mysql://localhost:3306/tgg?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai}
    username: ${TGG_DB_USER:tgg}
    password: ${TGG_DB_PASSWORD:tggdev}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 关键：schema 由 Flyway 全权管理，Hibernate 只做启动期校验。
      # 绝不用 create/update —— 那会让 Hibernate 擅自改表，与迁移脚本互相打架，
      # 且生产环境可能出现「代码改了表就变了」的不可控变更。
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

tgg:
  moderation:
    # 复核人 userId 全局白名单（逗号分隔）。复核是**平台层**动作，与群内管理员不是同一套
    # （理由同 tgg.merchant.reviewers）。为空则 /review_list·/review_approve·/review_reject
    # 对任何人不可用（启动期 WARN）。
    reviewers: ${TGG_MODERATION_REVIEWERS:}
  webhook:
    # 运行必须通过 TGG_WEBHOOK_SECRET 注入；此处不提供默认值（缺失即启动失败，刻意 fail-fast）
    secret: ${TGG_WEBHOOK_SECRET:}
    bot-token: ${TGG_BOT_TOKEN:}
  permission:
    admins: ${TGG_PERMISSION_ADMINS:}
  failover:
    enabled: ${TGG_FAILOVER_ENABLED:false}
  admission:
    # 模块四 · 准入与验证：默认关闭。多词键必须显式映射——Spring 默认会把 timeoutSeconds
    # 推导成 TGG_ADMISSION_TIMEOUTSECONDS（去连字符），与文档惯用的下划线写法不符。
    enabled: ${TGG_ADMISSION_ENABLED:false}
    timeout-seconds: ${TGG_ADMISSION_TIMEOUT_SECONDS:120}
    observation-seconds: ${TGG_ADMISSION_OBSERVATION_SECONDS:604800}
  ai:
    deepseek:
      # L3 云端审核：默认关闭。启用后消息正文会发送至 DeepSeek（仅正文，不含身份）。
      enabled: ${TGG_AI_DEEPSEEK_ENABLED:false}
      # 显式映射：Spring 默认会找 TGG_AI_DEEPSEEK_API_KEY，这里保留更直观的短名
      api-key: ${TGG_DEEPSEEK_API_KEY:}
  credit:
    # 模块七 · 信用分体系：默认关闭。不启用则整组组件不装配（审核主链路零影响）。
    enabled: ${TGG_CREDIT_ENABLED:false}
    # 显式映射：Spring 默认会把 privateKey 推导为 TGG_CREDIT_PRIVATEKEY（无下划线），与文档不符；
    # 启用模块七时必须注入 Ed25519 私钥（PKCS#8 Base64），缺失即启动失败（否则处罚令无法签名）。
    private-key: ${TGG_CREDIT_PRIVATE_KEY:}
  federation:
    # 模块八 · 联邦治理：默认关闭。不启用则对端广播、入站端点（POST /federation/penalty）均不装配。
    enabled: ${TGG_FEDERATION_ENABLED:false}
    # 对端节点清单：url|公钥Base64（逗号分隔）。启用时必填且非空，否则启动失败。
    # 每个节点用自己的 TGG_CREDIT_PRIVATE_KEY 签名，其公钥须配到对端的本清单里。
    nodes: ${TGG_FEDERATION_NODES:}
    # 联邦管理员 userId（全局白名单，逗号分隔）；为空时 /pending /approve /reject 对任何人不可用。
    admins: ${TGG_FEDERATION_ADMINS:}
  listing:
    # 模块五 · 群组收录：默认关闭。不启用则收录库、链接验证任务、/listing_* 命令均不装配。
    enabled: ${TGG_LISTING_ENABLED:false}
    # 显式映射多词键：Spring 默认会把 verifyCron 推导成 TGG_LISTING_VERIFYCRON（去连字符），
    # 与文档惯用的下划线写法不符，故逐个显式映射（同 tgg.credit.private-key 的处理）。
    verify-cron: ${TGG_LISTING_VERIFY_CRON:0 0 3 * * *}
    fail-threshold: ${TGG_LISTING_FAIL_THRESHOLD:3}
    retry-times: ${TGG_LISTING_RETRY_TIMES:2}
    retry-interval-minutes: ${TGG_LISTING_RETRY_INTERVAL_MINUTES:5}
    dispute-window-days: ${TGG_LISTING_DISPUTE_WINDOW_DAYS:7}
  merchant:
    # 模块六 · 商家收录：默认关闭。不启用则入驻、复核、保证金、/merchant_* 命令均不装配。
    enabled: ${TGG_MERCHANT_ENABLED:false}
    # 显式映射多词键（同上理由）：Spring 默认推导为 TGG_MERCHANT_INITIALSCORE。
    initial-score: ${TGG_MERCHANT_INITIAL_SCORE:500}
    # 资质复核人 userId（全局白名单，逗号分隔）；为空则启动 WARN，且 /merchant_review 对任何人不可用。
    reviewers: ${TGG_MERCHANT_REVIEWERS:}
