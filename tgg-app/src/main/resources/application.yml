spring:
  application:
    name: tgg

  datasource:
    # 生产环境必须用环境变量覆盖，尤其密码
    url: ${TGG_DB_URL:jdbc:mysql://localhost:3306/tgg?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai}
    username: ${TGG_DB_USER:tgg}
    password: ${TGG_DB_PASSWORD:tggdev}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 关键：schema 由 Flyway 全权管理，Hibernate 只做启动期校验。
      # 绝不用 create/update —— 那会让 Hibernate 擅自改表，与迁移脚本互相打架，
      # 且生产环境可能出现「代码改了表就变了」的不可控变更。
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

tgg:
  webhook:
    # 运行必须通过 TGG_WEBHOOK_SECRET 注入；此处不提供默认值（缺失即启动失败，刻意 fail-fast）
    secret: ${TGG_WEBHOOK_SECRET:}
    bot-token: ${TGG_BOT_TOKEN:}
  permission:
    admins: ${TGG_PERMISSION_ADMINS:}
  failover:
    enabled: ${TGG_FAILOVER_ENABLED:false}
  ai:
    deepseek:
      # L3 云端审核：默认关闭。启用后消息正文会发送至 DeepSeek（仅正文，不含身份）。
      enabled: ${TGG_AI_DEEPSEEK_ENABLED:false}
      # 显式映射：Spring 默认会找 TGG_AI_DEEPSEEK_API_KEY，这里保留更直观的短名
      api-key: ${TGG_DEEPSEEK_API_KEY:}
  credit:
    # 模块七 · 信用分体系：默认关闭。不启用则整组组件不装配（审核主链路零影响）。
    enabled: ${TGG_CREDIT_ENABLED:false}
    # 显式映射：Spring 默认会把 privateKey 推导为 TGG_CREDIT_PRIVATEKEY（无下划线），与文档不符；
    # 启用模块七时必须注入 Ed25519 私钥（PKCS#8 Base64），缺失即启动失败（否则处罚令无法签名）。
    private-key: ${TGG_CREDIT_PRIVATE_KEY:}
