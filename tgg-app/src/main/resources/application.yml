# ── OpenAPI / Swagger 文档（原文 §17 交付物清单的「API 文档」）────────────────────
# ⚠️ **默认关闭**。springdoc 会扫描全部 @RestController，把端点清单与参数结构暴露成
# JSON（/v3/api-docs）与界面（/swagger-ui.html）——那是一条信息面。与项目
# 「未启用即零影响」的纪律一致，默认 false；启用后**不要**裸露到公网，
# 应只在内网开放或加来源 IP 白名单。
#
# 变量名显式映射：多词键的宽松绑定会去掉连字符（TGG_OPENAPI_ENABLED 之外的写法易踩坑），
# 故这里写死映射，与 README 的配置表保持一致。
springdoc:
  api-docs:
    enabled: ${TGG_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${TGG_OPENAPI_ENABLED:false}

# ── Actuator（原文 §15.2「应用：OWASP ASVS、**Actuator 锁定**、CSP/HSTS」）──────────────
# 引入它的**唯一**目的：让容器/K8s 的健康检查反映**业务就绪**（含 DB 连通性），
# 而不是「端口在听就算健康」（Dockerfile 此前用 /dev/tcp 探端口，README 已注明不代表业务就绪）。
# ⚠️ **必须锁定**——下面三行都是「把暴露面压到最小」的刻意设置，不要放宽：
management:
  endpoints:
    web:
      exposure:
        # 只暴露 health。**不要**改成 "*"，也不要加上 env / beans / configprops / heapdump /
        # threaddump / loggers —— 它们会泄漏配置值、环境变量、bean 依赖图与堆内存内容。
        include: health
  endpoint:
    health:
      # never：health 只回 {"status":"UP"}，不回 DB / 磁盘等分项。
      # 分项在**未鉴权**的端点上等于一张内部结构图（哪个组件挂了、连的什么库）。
      show-details: never
      probes:
        # 关掉 K8s 的 liveness/readiness 子组。Boot 检测到 Kubernetes 会**自动打开**它们，
        # 使暴露面随部署环境漂移；本项目的 k8s 清单用 tcpSocket 探针，不需要这两个端点。
        enabled: false

spring:
  application:
    name: tgg

  datasource:
    # 生产环境必须用环境变量覆盖，尤其密码
    url: ${TGG_DB_URL:jdbc:mysql://localhost:3306/tgg?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai}
    username: ${TGG_DB_USER:tgg}
    # 无默认值：绝不用开发密码兜底。未注入即连接失败（fail-fast），避免生产误用弱口令。
    password: ${TGG_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 关键：schema 由 Flyway 全权管理，Hibernate 只做启动期校验。
      # 绝不用 create/update —— 那会让 Hibernate 擅自改表，与迁移脚本互相打架，
      # 且生产环境可能出现「代码改了表就变了」的不可控变更。
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

tgg:
  admin:
    # 模块十一 · Web 后台（审批中心）：默认**不装配**——api-token 未配置（或为空白）时端点根本不存在。
    # ⚠️ 本项**只是装配开关，不是鉴权凭据**：鉴权已改为**服务端会话**
    # （`POST /admin/auth/login` 签发不透明令牌，之后带 `Authorization: Bearer <会话令牌>`）；
    # 旧的 `X-Operator-Id` 头已**彻底移除**（它可被客户端伪造）。见 `SECURITY.md` 与 `AdminSessionFilter`。
    # ⚠️ 后端 REST API + `frontend/`（Vue 3 控制台，**独立静态站、不经 Spring 托管**，需自配反代）；
    # 原文要求的 RulEuler 规则设计器 / Grafana 合规监控仍不在范围内。
    api-token: ${TGG_ADMIN_API_TOKEN:}
    # 待办超时提醒：超过 N 小时提醒、超过 M 小时升级（**跳过硬红线**——它们已由 §10.6 的 2h SLA 通道负责）。
    overdue-remind-hours: ${TGG_ADMIN_OVERDUE_REMIND_HOURS:24}
    overdue-escalate-hours: ${TGG_ADMIN_OVERDUE_ESCALATE_HOURS:72}
    overdue-cron: ${TGG_ADMIN_OVERDUE_CRON:0 15 * * * *}
    # ── 账号体系（模块十一 · 账号与权限模型）──
    # 超管由环境变量引导创建（**无任何 API 可建超管**）；password-hash 是 PasswordHasher 生成的
    # pbkdf2$<iter>$<saltB64>$<hashB64> 串（生成方式见 docs/DEPLOYMENT-HANDBOOK.md）。二者皆空则不创建超管。
    super-user: ${TGG_ADMIN_SUPER_USER:}
    super-password-hash: ${TGG_ADMIN_SUPER_PASSWORD_HASH:}
    # 会话有效期（小时）。热生效（登录时读取）。
    session-ttl-hours: ${TGG_ADMIN_SESSION_TTL_HOURS:12}
    # 连续登录失败达该次数即锁定账号 / 锁定时长（分钟）。
    login-max-failed-attempts: ${TGG_ADMIN_LOGIN_MAX_FAILED:5}
    login-lock-minutes: ${TGG_ADMIN_LOGIN_LOCK_MINUTES:15}
    # 每来源 IP 每分钟允许的登录尝试次数（防跨账号爆破）。
    login-max-per-minute: ${TGG_ADMIN_LOGIN_MAX_PER_MINUTE:20}
    # 是否信任反向代理注入的 X-Forwarded-For 作为登录限流键。
    # ⚠️ 默认 false = 取 TCP 对端地址（getRemoteAddr），因 XFF 首段客户端可伪造（轮换即绕过限流）。
    #    仅当应用**只接受可信反代**的连接（直连不可达）时才置 true；此时取 XFF 最后一跳。
    trust-forwarded-for: ${TGG_ADMIN_TRUST_FORWARDED_FOR:false}
    # Telegram 登录（Login Widget）：bot-username 供前端 data-telegram-login；验签用 tgg.webhook.bot-token。
    tg-login:
      bot-username: ${TGG_ADMIN_TG_LOGIN_BOT_USERNAME:}
      max-age-hours: ${TGG_ADMIN_TG_LOGIN_MAX_AGE_HOURS:1}
      # 允许经 Telegram 登录后台的 userId 白名单（逗号分隔）。
      # ⚠️ 空 = **无人**可经 TG 登录（fail-closed）。验签只证明「数据来自 Telegram」，
      #    不证明「此人被授权」——不配此项则 TG 登录入口对任何人都不放行。
      allowlist: ${TGG_ADMIN_TG_LOGIN_ALLOWLIST:}
  teach:
    # 模块九 §10.3 教学门槛 · 入群时长（默认 30 天）。数据来自 chat_member 事件采集（V15）。
    # ⚠️ 该门槛依赖「bot 是群管理员 + webhook 的 allowed_updates 含 chat_member」——
    #    两者缺一则一条记录都不会有；此时无记录者一律放行（历史入群时间在 Telegram 侧不可回收，
    #    拒绝无记录者会永久误伤 bot 上线前入群的成员）。
    min-membership-days: ${TGG_TEACH_MIN_MEMBERSHIP_DAYS:30}
  moderation:
    # 复核人 userId 全局白名单（逗号分隔）。复核是**平台层**动作，与群内管理员不是同一套
    # （理由同 tgg.federation.admins）。为空则 /review_list·/review_approve·/review_reject
    # 对任何人不可用（启动期 WARN）。
    reviewers: ${TGG_MODERATION_REVIEWERS:}
    # 敏感话题分级（模块九 §10.5）：默认关闭。启用后按群对敏感话题分级（命中即删除 + 入队复核，
    # **不封禁**），并受「群话题标签」（/group_tag）豁免——本群声明了某话题即豁免该话题。
    sensitive-grading-enabled: ${TGG_MODERATION_SENSITIVE_GRADING_ENABLED:false}
    # 红线复核 SLA（§10.6）：硬红线命中后须在 N 小时内人工确认（/review_approve 或 /review_reject），
    # 超时向白名单发**紧急级**催办。只催办、不自动解封——原文未规定超时后果。
    redline-review-sla-hours: ${TGG_MODERATION_REDLINE_SLA_HOURS:2}
    redline-sla-cron: ${TGG_MODERATION_REDLINE_SLA_CRON:0 5 * * * *}
  breach:
    # 数据泄露 72 小时通报（§11.2）：催办 cron（默认每小时一次）。
    # 催办走**紧急级**通知（不受用户免打扰阻塞），发给 TGG_MODERATION_REVIEWERS 白名单。
    remind-cron: ${TGG_BREACH_REMIND_CRON:0 0 * * * *}
  retention:
    # 数据保留策略（§11.2）：默认**只报告不清理**。保留策略的本质是自动删除业务数据，
    # 把它做成「默认就会删」很危险——先看每日报告，再决定是否放行。
    # 审计表 audit_log **永不清理**（不可删，硬编码排除，见 RetentionService）。
    enabled: ${TGG_RETENTION_ENABLED:false}
    reviewed-queue-days: ${TGG_RETENTION_REVIEWED_QUEUE_DAYS:90}
    strike-days: ${TGG_RETENTION_STRIKE_DAYS:365}
    cron: ${TGG_RETENTION_CRON:0 30 4 * * *}
  webhook:
    # 运行必须通过 TGG_WEBHOOK_SECRET 注入；此处不提供默认值（缺失即启动失败，刻意 fail-fast）
    secret: ${TGG_WEBHOOK_SECRET:}
    bot-token: ${TGG_BOT_TOKEN:}
  interaction:
    # 交互卡片（/menu 面板、危险操作确认卡）；默认开启（matchIfMissing）。
    enabled: ${TGG_INTERACTION_ENABLED:true}
    # 群里是否明文展示用户 ID（/whoami 的群内回复 + /menu 面板身份行）。
    # 默认 false（隐私优先）：群内只引导「请私聊查看」，明文 ID 仅在私聊给出。
    # 置 true 后群内也明文展示——面板卡片可被转发，请自行权衡。
    whoami-group-visible: ${TGG_INTERACTION_WHOAMI_GROUP_VISIBLE:false}
  command-menu:
    # 启动期把 @BotCommand 声明的命令清单注册到 Telegram——即客户端里输入 "/" 时弹出的提示菜单。
    # 默认**开启**：不注册的话命令在客户端里毫无提示（公网实测 getMyCommands 返回 0 条，29 个命令只能靠背）。
    # 无 TGG_BOT_TOKEN 时跳过并 WARN；注册失败只记日志、不影响启动。
    enabled: ${TGG_COMMAND_MENU_ENABLED:true}
  permission:
    admins: ${TGG_PERMISSION_ADMINS:}
  failover:
    enabled: ${TGG_FAILOVER_ENABLED:false}
  admission:
    # 模块四 · 准入与验证：默认关闭。多词键必须显式映射——Spring 默认会把 timeoutSeconds
    # 推导成 TGG_ADMISSION_TIMEOUTSECONDS（去连字符），与文档惯用的下划线写法不符。
    enabled: ${TGG_ADMISSION_ENABLED:false}
    timeout-seconds: ${TGG_ADMISSION_TIMEOUT_SECONDS:120}
    observation-seconds: ${TGG_ADMISSION_OBSERVATION_SECONDS:604800}
  ai:
    deepseek:
      # L3 云端审核：默认关闭。启用后消息正文会发送至 DeepSeek（仅正文，不含身份）。
      enabled: ${TGG_AI_DEEPSEEK_ENABLED:false}
      # 显式映射：Spring 默认会找 TGG_AI_DEEPSEEK_API_KEY，这里保留更直观的短名
      api-key: ${TGG_DEEPSEEK_API_KEY:}
  credit:
    # 模块七 · 信用分体系：默认关闭。不启用则整组组件不装配（审核主链路零影响）。
    enabled: ${TGG_CREDIT_ENABLED:false}
    # 显式映射：Spring 默认会把 privateKey 推导为 TGG_CREDIT_PRIVATEKEY（无下划线），与文档不符；
    # 启用模块七时必须注入 Ed25519 私钥（PKCS#8 Base64），缺失即启动失败（否则处罚令无法签名）。
    private-key: ${TGG_CREDIT_PRIVATE_KEY:}
  federation:
    # 模块八 · 联邦治理：默认关闭。不启用则对端广播、入站端点（POST /federation/penalty）均不装配。
    enabled: ${TGG_FEDERATION_ENABLED:false}
    # 对端节点清单：url|公钥Base64（逗号分隔）。启用时必填且非空，否则启动失败。
    # 每个节点用自己的 TGG_CREDIT_PRIVATE_KEY 签名，其公钥须配到对端的本清单里。
    nodes: ${TGG_FEDERATION_NODES:}
    # 联邦管理员 userId（全局白名单，逗号分隔）；为空时 /pending /approve /reject 对任何人不可用。
    admins: ${TGG_FEDERATION_ADMINS:}
  listing:
    # 模块五 · 群组收录：默认关闭。不启用则收录库、链接验证任务、/listing_* 命令均不装配。
    enabled: ${TGG_LISTING_ENABLED:false}
    # 显式映射多词键：Spring 默认会把 verifyCron 推导成 TGG_LISTING_VERIFYCRON（去连字符），
    # 与文档惯用的下划线写法不符，故逐个显式映射（同 tgg.credit.private-key 的处理）。
    verify-cron: ${TGG_LISTING_VERIFY_CRON:0 0 3 * * *}
    fail-threshold: ${TGG_LISTING_FAIL_THRESHOLD:3}
    retry-times: ${TGG_LISTING_RETRY_TIMES:2}
    retry-interval-minutes: ${TGG_LISTING_RETRY_INTERVAL_MINUTES:5}
    dispute-window-days: ${TGG_LISTING_DISPUTE_WINDOW_DAYS:7}
  merchant:
    # 模块六 · 商家收录：默认关闭。不启用则入驻、复核、保证金、/merchant_* 命令均不装配。
    enabled: ${TGG_MERCHANT_ENABLED:false}
    # 显式映射多词键（同上理由）：Spring 默认推导为 TGG_MERCHANT_INITIALSCORE。
    initial-score: ${TGG_MERCHANT_INITIAL_SCORE:500}
    # 原资质复核人白名单（TGG_MERCHANT_REVIEWERS）已裁撤（2026-09-22：商家只有联邦管理员才可以审核处理）
    # ——商家管理命令的授权源是 tgg.federation.admins / 平台 FEDERATION_ADMIN。
  escrow:
    # 模块十二 · 担保交易（调研报告 §3 gap-ESC-02）：默认关闭。不启用则订单状态机、争议裁决
    # 与 /escrow_* 命令均不装配。链上接入（DepositGateway）留待后续波，本波只落本地账本与状态机。
    # 显式映射多词键：Spring 默认会把 disputeWindowDays 推导为 TGG_ESCROW_DISPUTEWINDOWDAYS（去连字符），
    # 与文档惯用的下划线写法不符，故逐个显式映射（同 tgg.merchant.initial-score 的处理）。
    enabled: ${TGG_ESCROW_ENABLED:false}
    # 通知通道开关（用户要求「群内与私聊都要有，但要有开关」）：群内让进度公开可见，
    # 私聊确保对方收到（对方可能不在那个群）。两个都关时交易对他方静默。
    notify:
      group-enabled: ${TGG_ESCROW_NOTIFY_GROUP_ENABLED:true}
      private-enabled: ${TGG_ESCROW_NOTIFY_PRIVATE_ENABLED:true}
    dispute-window-days: ${TGG_ESCROW_DISPUTE_WINDOW_DAYS:7}
    order-timeout-hours: ${TGG_ESCROW_ORDER_TIMEOUT_HOURS:72}
