# 持续集成：构建 + 全量测试 + 前端构建与渲染验收。
#
# 设计要点（都与本项目的既有约束对齐，改之前请先读注释）：
#   * **必须带 MySQL**：`*IT` 集成测试连独立库 `tgg_test`（见 tgg-app/src/test/resources/application.yml），
#     刻意不用 H2 —— H2 的 MySQL 兼容模式会掩盖方言差异。
#   * **`mvn verify`，不是 `mvn test`**：surefire 只跑 `*Test`；`*IT` 由 failsafe 在 verify 阶段执行。
#     只跑 `mvn test` 会**静默跳过全部集成测试**而得到绿灯。
#   * **测试凭据由本流程注入**：测试配置一律走环境变量占位符，仓库里不落字面凭据。
#     这里注入的是一眼可辨的测试值，**不得**用于任何真实环境。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & verify (JDK 21 + MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          # 与下方 Build & verify 注入的 TGG_TEST_DB_* 严格一致
          MYSQL_DATABASE: tgg_test
          MYSQL_USER: tgg
          # 仅供 CI 的测试库容器使用，非任何真实环境的凭据
          MYSQL_PASSWORD: tgg-ci-test-only
        ports:
          - 3306:3306
        # GitHub Actions 会等健康检查通过后才启动 steps，故不需要额外的等待脚本
        # （runner 上也没有 mysql client 可用）。
        #
        # ⚠️ `options` 里的每一项都会被**原样传给 `docker create`**——只能写 docker 参数，
        # **不能写 mysqld 参数**。此前这里挂着 `--character-set-server` / `--collation-server` /
        # `--default-time-zone`，CI 首次实跑即死在 `unknown flag: --character-set-server`（exit 125），
        # 整个 build job 在**服务创建阶段**就失败——注意这不是「测试挂了」，而是服务压根没起来。
        #
        # 那三项**不需要**，本机起 `mysql:8.4`（不带任何参数）实测 @@ 变量为：
        #   character_set_server = utf8mb4 ｜ collation_server = utf8mb4_0900_ai_ci
        #   time_zone = SYSTEM ｜ system_time_zone = UTC ｜ NOW() == UTC_TIMESTAMP()
        #   · charset：默认已是 utf8mb4；且本项目**每张表**都显式声明 charset/collate
        #     （每张 CREATE TABLE 都显式声明 COLLATE，逐文件核对无遗漏。⚠️ 数字随迁移增长，
        #      故此处刻意不写死——本项目已吃过「手写计数静默失真」的教训），服务端默认值影响不到表；
        #   · collation：容器默认是 utf8mb4_0900_ai_ci，与文档惯写的 utf8mb4_unicode_ci 不同，
        #     但同样因表级显式声明而不生效（包括依赖大小写不敏感唯一性的 banned_words）；
        #   · time_zone：SYSTEM 而 system_time_zone=UTC，与原先想设的 +00:00 等价。
        # 将来若确需改服务端变量，正确做法是挂载 /etc/mysql/conf.d/*.cnf
        # （GitHub Actions 的 services 不支持给容器传 command 参数），而不是往 options 里塞 mysqld 开关。
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 测试配置一律走 `TGG_TEST_*` 占位符（仓库不落字面凭据），故在此注入测试值。
      - name: Build & verify
        env:
          TGG_TEST_DB_USER: tgg
          TGG_TEST_DB_PASSWORD: tgg-ci-test-only
          TGG_TEST_WEBHOOK_SECRET: ci-test-secret
          TGG_TEST_BOT_TOKEN: ci-test-bot-token
          TGG_TEST_PERMISSION_ADMINS: "-777003:42:ADMIN"
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/*-reports/*.txt'
          if-no-files-found: ignore

  dependency-scan:
    name: Dependency vulnerability scan (SBOM → OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 只出 SBOM（cyclonedx 插件绑在根 pom 的 package 阶段）：依赖漏洞与测试无关，
      # 故 -DskipTests，也就**不需要** MySQL 服务。
      - name: Generate SBOM
        run: mvn -B -ntp -DskipTests package

      # 退出码契约：0=无达标发现、1=有（即本步骤失败）、2=IO 错、3=网络/服务错。
      # ⚠️ 网络失败**不会**退化成「0 漏洞」报告——这是脚本刻意 fail-closed 的地方。
      - name: Scan dependencies against OSV
        run: python3 tools/security/scan_dependencies.py --sbom target/bom.json --md-out target/security/dependency-scan.md

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan
          path: target/security/dependency-scan.md
          if-no-files-found: ignore

  static-checks:
    name: Static checks (unused imports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 纯文本分析，不需要 JDK / MySQL —— 故单独成一个 job（比挂在 build 上更省，失败信号也更清晰）。
      # 为什么需要这道门：javac **不报**未用 import，`mvn verify` 全绿也照旧留存，
      # 于是仓库里会静默积累（本仓库 2026-09-21/22 连清两轮：17 处/13 文件 + 1 文件）。
      # 判据保守（宁漏不误删）：import 的简单名在「除 import 行外的全部文本」里零出现才算未用，
      # 注释/javadoc 计为正文 —— 故仅供 {@link} 引用的 import 不会被误报。
      - name: Unused import check
        run: python3 tools/quality/check_unused_imports.py

  docker-build:
    name: Docker build（镜像可构建 + 非 root）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Dockerfile 是多阶段构建（maven 构建 → JRE 运行）。用 GHA 层缓存，否则每次都要
      # 在容器里重下一次 Maven 依赖（首次几分钟，之后走缓存）。
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tgg-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 「能构建」不等于「以非 root 运行」——后者是容器化交付的硬要求（原文 §15.2 口径），
      # 而它只体现在 image config 里，构建成功看不出来。这里断言 uid 10001 的 app 用户。
      - name: Assert non-root runtime user
        run: |
          user="$(docker image inspect tgg-app:ci --format '{{.Config.User}}')"
          echo "Config.User = ${user:-<空=默认 root>}"
          if [ "$user" != "app" ]; then
            echo "::error::镜像必须以非 root 用户运行（期望 app，实际 '${user}'）"
            exit 1
          fi

      # 上面的 Config.User 只证明**配置写了 app**——名称可以在 /etc/passwd 里被改成 uid 0，
      # 那样断言会骗过自己。这一步真起容器读运行期 uid，是「非 root」的硬证据。
      - name: Assert runtime uid is 10001 (not 0)
        run: |
          uid="$(docker run --rm --entrypoint id tgg-app:ci -u)"
          echo "运行期 uid = ${uid}"
          if [ "$uid" != "10001" ]; then
            echo "::error::容器运行期 uid 应为 10001（非 root），实际 '${uid}'"
            exit 1
          fi

      # compose 文件里的 `${VAR:?必填}` 语法只有在解析时才暴露——本机 `docker compose config`
      # 已验过，这里固化成 CI 步骤，避免以后编辑 compose 时把必填校验写坏。
      - name: docker-compose.yml is parseable
        run: |
          TGG_WEBHOOK_SECRET=x MYSQL_ROOT_PASSWORD=x TGG_DB_PASSWORD=x docker compose config >/dev/null
          echo "docker compose config 通过"

  frontend:
    name: Frontend (vitest + render probe)
    runs-on: ubuntu-latest
    # 本 job 全部命令在 frontend/ 下执行（package.json 与 pnpm-lock.yaml 都在那里）
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # version 与本机一致（12.4.2）——本机 pnpm-lock.yaml 是它生成的（lockfileVersion 9.0）。
      # 版本不一致时，`--frozen-lockfile` 可能因锁文件格式差异而误红。
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # 单测（主题解析 + API 层纯逻辑）。刻意独立成 step：红时一眼看出是逻辑挂了还是渲染挂了。
      - name: Unit tests (vitest)
        run: pnpm test

      # vue-tsc 类型检查 + vite 打包。构建通过 ≠ 页面能看——渲染由下一个 step 的探针兜。
      - name: Type-check & build (vue-tsc + vite)
        run: pnpm build

      # playwright-core **不下载**浏览器（它是 core 版），故复用 runner 预装的 Chrome/Chromium，
      # 通过 CHROME_PATH 交给探针。找不到就显式失败——不要静默跳过渲染验收。
      - name: Locate a Chromium-based browser
        run: |
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            BIN="$(command -v "$c" 2>/dev/null || true)"
            # `command -v` 只证明「文件存在」——Ubuntu 上 chromium/chromium-browser 常是 snap 包装脚本，
            # 存在但不可启动。必须真的能打印版本才算数，否则会把「显式失败」退化成浏览器启动处的困惑报错。
            if [ -n "$BIN" ] && "$BIN" --version >/dev/null 2>&1; then
              echo "CHROME_PATH=$BIN" >> "$GITHUB_ENV"
              echo "Using browser: $BIN — $("$BIN" --version)"
              exit 0
            fi
          done
          echo "::error::Runner 上找不到可启动的 Chromium 系浏览器，无法做渲染验收"
          exit 1

      # preview 与探针必须在**同一个 step** 内：`&` 起的后台进程随 step 的 shell 退出而结束。
      - name: Serve dist + render probe
        env:
          OUT_DIR: ${{ runner.temp }}/tgg-shot
        run: |
          # --strictPort：端口被占时**直接失败**，而不是漂移到别的端口——否则探针硬编码的 4173
          # 会连不上，报错指向「连不上」而非根因「端口漂移」。
          pnpm preview --host 127.0.0.1 --strictPort &
          ready=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          # 就绪探测超时必须**显式失败**：否则探针会去连一个不存在的服务，报错不指向真正的原因。
          if [ -z "$ready" ]; then
            echo "::error::preview 服务 30s 内未在 http://127.0.0.1:4173/ 就绪"
            exit 1
          fi
          mkdir -p "$OUT_DIR"
          TARGET_URL=http://127.0.0.1:4173/ node tools/screenshot-probe.mjs

      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-render
          path: ${{ runner.temp }}/tgg-shot
          if-no-files-found: ignore
