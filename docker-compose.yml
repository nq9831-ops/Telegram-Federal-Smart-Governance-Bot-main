# 单机部署编排：应用 + MySQL。
#
# 用法：
#   1) 准备环境变量（缺一个都起不来——应用对关键密钥刻意 fail-fast）：
#        export TGG_WEBHOOK_SECRET='<Telegram webhook 的 secret token>'
#        export MYSQL_ROOT_PASSWORD='<自定义>'
#        export TGG_DB_PASSWORD='<自定义>'
#      ▶ 想把**所有模块**一次打开：把所有开关与密钥写进一个 .env 文件，
#        `docker compose --env-file <该文件> up -d --build`。
#        ⚠️ 值里含 `&` 或 `|` 的变量（TGG_DB_URL、TGG_FEDERATION_NODES）**必须带引号**，
#        否则会被 shell 当控制符 → 变量静默为空 → 应用连到默认库。
#   2) docker compose up -d --build
#   3) 查看状态：docker compose ps / docker compose logs -f app
#
# 说明：
#   - 数据库**只绑 127.0.0.1**，不对公网暴露；应用通过 compose 内网 `db` 主机名连它。
#     （注意：下面 app 的 TGG_DB_URL 指向内网 `db`，若用 all-on 清单请同步替换其中的 host。）
#   - 应用监听 8080 并暴露到宿主机；webhook 上线前需放行/反代该端口。
#   - 健康检查探 **/actuator/health**（Actuator 已引入，原文 §15.2）：DB 不可达时它返回 503、
#     容器随之判为 unhealthy——比「只探端口」更贴近「业务就绪」。
#     首次启动的迁移/装配窗口由 Dockerfile 的 --start-period=45s 覆盖。
name: tgg

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # DB 容器固定 UTC。
      # ⚠️ 与应用侧**并不一致**：下面 app 服务的 `TGG_DB_URL` 带 `connectionTimeZone=Asia/Shanghai`。
      # 两处谁对取决于实体时间字段类型（Instant 还是 LocalDateTime）——**未核实，勿当已对齐**。
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: tgg
      MYSQL_USER: tgg
      MYSQL_PASSWORD: ${TGG_DB_PASSWORD:?必须设置 TGG_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      # 数组形式不过 shell，故用 CMD-SHELL；`$$` 让 compose 不插值、留给容器内 shell
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 缺失即启动失败——刻意 fail-fast，不给默认值
      TGG_WEBHOOK_SECRET: ${TGG_WEBHOOK_SECRET:?必须设置 TGG_WEBHOOK_SECRET}
      TGG_DB_URL: jdbc:mysql://db:3306/tgg?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai
      TGG_DB_USER: tgg
      TGG_DB_PASSWORD: ${TGG_DB_PASSWORD}
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  db-data:
